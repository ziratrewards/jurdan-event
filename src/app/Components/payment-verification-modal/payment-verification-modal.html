@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/65 backdrop-blur-md transition-all duration-300">
    <div class="relative w-full max-w-md bg-white rounded-[32px] p-8 sm:p-10 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.3)] border border-gray-100 flex flex-col items-center text-center overflow-hidden">
      
      <!-- Top subtle gradient glow -->
      <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-64 h-64 rounded-full blur-3xl opacity-30 pointer-events-none"
        [ngClass]="{
          'bg-blue-400': status === 'checking',
          'bg-emerald-400': status === 'accepted',
          'bg-rose-400': status === 'rejected'
        }">
      </div>

      <!-- Icon Section -->
      <div class="relative mb-6">
        @if (status === 'checking') {
          <!-- Modern pulsating radar spinner -->
          <div class="relative flex items-center justify-center w-24 h-24">
            <!-- Pulsing outer wave -->
            <div class="absolute inset-0 rounded-full bg-blue-500/15 animate-ping duration-1000"></div>
            <!-- Middle glow ring -->
            <div class="absolute inset-2 rounded-full bg-blue-500/10"></div>
            <!-- High-speed spinner ring -->
            <div class="absolute inset-1 rounded-full border-3 border-transparent border-t-blue-600 border-r-blue-400 animate-spin"></div>
            <!-- Center Shield Icon -->
            <div class="relative z-10 w-14 h-14 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center shadow-inner">
              <svg class="w-7 h-7 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
              </svg>
            </div>
          </div>
        }

        @if (status === 'accepted') {
          <!-- Success green checkmark with glow -->
          <div class="relative flex items-center justify-center w-24 h-24">
            <div class="absolute inset-0 rounded-full bg-emerald-500/20 animate-pulse"></div>
            <div class="w-20 h-20 rounded-full bg-emerald-100 text-emerald-600 ring-8 ring-emerald-50 flex items-center justify-center shadow-lg transition-transform duration-300 scale-100">
              <svg class="w-10 h-10 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
              </svg>
            </div>
          </div>
        }

        @if (status === 'rejected') {
          <!-- Rejected red cross with alert shake -->
          <div class="relative flex items-center justify-center w-24 h-24">
            <div class="absolute inset-0 rounded-full bg-rose-500/20"></div>
            <div class="w-20 h-20 rounded-full bg-rose-100 text-rose-600 ring-8 ring-rose-50 flex items-center justify-center shadow-lg">
              <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </div>
          </div>
        }
      </div>

      <!-- Text Content -->
      <h3 class="text-xl sm:text-2xl font-black text-gray-900 mb-2.5 tracking-tight">
        {{ getTitle() }}
      </h3>

      <p class="text-sm font-medium text-gray-500 mb-6 leading-relaxed max-w-sm">
        {{ getSubtitle() }}
      </p>

      @if (status === 'checking') {
        <!-- Dynamic Progress Bar -->
        <div class="w-full bg-gray-100 h-1.5 rounded-full overflow-hidden mb-6">
          <div class="h-full bg-linear-to-r from-blue-500 via-indigo-500 to-blue-600 rounded-full animate-progress-indeterminate"></div>
        </div>

        <!-- Security Info Badge -->
        <div class="flex items-center justify-center gap-1.5 text-xs font-semibold text-gray-400 bg-gray-50 border border-gray-100 px-3.5 py-1.5 rounded-full">
          <svg class="w-3.5 h-3.5 text-blue-500" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
          </svg>
          <span>256-bit Bank-Grade SSL Secure Verification</span>
        </div>
      }

      @if (status === 'rejected') {
        <!-- Action Button for Rejection -->
        <button
          type="button"
          (click)="onRetry()"
          class="w-full mt-2 py-3.5 px-6 rounded-2xl bg-gray-900 text-white font-bold text-sm shadow-md hover:bg-black active:scale-[0.98] transition cursor-pointer flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>Try Again</span>
        </button>
      }

    </div>
  </div>
}
