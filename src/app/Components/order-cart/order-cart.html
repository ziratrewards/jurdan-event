<div class="order-cart-overlay" (click)="closeCart()">

    <div class="order-cart" (click)="$event.stopPropagation()">

        <!-- Drag Indicator -->
        <div class="mx-auto mb-3 h-1 w-12 rounded-full bg-gray-300"></div>

        <!-- Header -->
        <div class="flex items-center gap-2 border-b border-gray-100 px-4 py-4 sm:px-6">

            <svg class="h-5 w-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 2h12m-8 4a1 1 0 1 1-2 0m10 0a1 1 0 1 1-2 0"
                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>

            <h2 class="text-lg font-bold text-gray-900">
                Your order
            </h2>

        </div>

        <!-- Orders -->
        <div class="max-h-[55vh] overflow-y-auto px-4 py-4 sm:px-6">

            @for (item of items; track item.id) {

            <div class="mb-3">

                <div class="flex items-center justify-between rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3">

                    <div class="flex min-w-0 items-center gap-3">

                        <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-primary/10">
                            <svg class="h-4 w-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M4 6h16M6 3v6m12-6v6M6 21h12a2 2 0 0 0 2-2V9H4v10a2 2 0 0 0 2 2Z"
                                    stroke-width="1.5" />
                            </svg>
                        </div>

                        <div class="min-w-0">

                            <p class="truncate text-sm font-bold text-gray-900">
                                {{ item.name }}
                            </p>

                            <p class="text-xs text-gray-500">
                                × {{ item.quantity }}
                            </p>

                        </div>

                    </div>

                    <div class="flex shrink-0 items-center gap-3">

                        <span class="text-sm font-bold text-gray-900 sm:text-base">
                            {{ (item.price * item.quantity).toFixed(2) }} JOD
                        </span>

                        <button type="button"
                            class="flex h-8 w-8 items-center justify-center rounded-full text-gray-400 transition hover:bg-gray-200 hover:text-gray-900"
                            (click)="removeItem(item.id)">
                            ×
                        </button>

                    </div>

                </div>

            </div>

            }

            @if (items.length === 0) {

            <div class="flex min-h-32 items-center justify-center text-sm text-gray-400">
                No tickets selected
            </div>

            }

        </div>

        <!-- Summary -->
        <div class="border-t border-gray-100 px-4 py-4 sm:px-6">

            <div class="flex items-center justify-between">

                <span class="text-sm text-gray-500">
                    {{ totalTickets }}
                    {{ totalTickets === 1 ? 'ticket' : 'tickets' }}
                </span>

                <span class="text-lg font-bold text-gray-900 sm:text-xl">
                    {{ totalPrice.toFixed(2) }} JOD
                </span>

            </div>

            <button type="button" [disabled]="items.length === 0"
                class="mt-4 w-full rounded-2xl bg-primary py-3.5 text-sm font-bold text-white transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-40"
                (click)="proceedToCheckout()">
                Proceed to checkout
            </button>

        </div>

    </div>

</div>
