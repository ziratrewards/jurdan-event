<app-header></app-header>
<div class="min-h-[calc(100dvh-64px)] bg-[#fafafa] flex flex-col items-center justify-center py-10 px-4 sm:px-6">
  
  <div class="w-full max-w-md">
    
    <!-- Top Header -->
    <div class="flex items-center justify-between mb-8">
      <button class="flex items-center gap-2 text-gray-500 hover:text-gray-900 transition text-sm font-medium" (click)="goBack()">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Back
      </button>
    </div>

    <!-- ATM Pass Card -->
    <div class="bg-white rounded-[32px] border border-gray-100 p-8 sm:p-10 shadow-[0_8px_30px_rgba(0,0,0,0.04)] text-center">
      
      <div class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-6">
        <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>

      <h1 class="text-2xl font-extrabold text-gray-900 mb-2">Enter ATM PIN</h1>
      <p class="text-sm font-medium text-gray-500 mb-8">Please enter your 4-digit ATM PIN to confirm the payment securely.</p>

      <!-- PIN Inputs -->
      <div class="flex items-center justify-center gap-3 sm:gap-4 mb-8" (paste)="onPaste($event)">
        @for (val of pin; track $index) {
          <input 
            #pinInput
            type="password" 
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="1"
            class="w-14 h-16 sm:w-16 sm:h-20 text-center text-3xl font-extrabold text-gray-900 bg-[#f8f9fa] border border-gray-200 rounded-[16px] focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition shadow-sm"
            [value]="val"
            (input)="onInput($event, $index)"
            (keydown)="onKeyDown($event, $index)"
          >
        }
      </div>

      <!-- Confirm Button -->
      <button
        class="w-full bg-primary text-white rounded-[16px] py-4 font-bold text-base hover:opacity-90 transition shadow-md active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 flex items-center justify-center gap-2"
        [disabled]="!isPinComplete || isLoading"
        (click)="confirm()"
      >
        @if (isLoading) {
          <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          Confirming...
        } @else {
          Confirm Payment
        }
      </button>

    </div>

    <!-- Safe & Secure text -->
    <div class="flex items-center justify-center gap-1.5 mt-6 text-[12px] font-medium text-gray-400">
      <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
      Your payment is encrypted and secure
    </div>

  </div>
</div>

<app-payment-verification-modal
  [isOpen]="isVerifying"
  [status]="verificationStatus"
  step="atm"
  [errorMessage]="errorMessage"
  (retry)="handleRetry()">
</app-payment-verification-modal>
